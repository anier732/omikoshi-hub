<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Error</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            cursor: none;
        }
        /* リンゴマーク（簡易SVG） */
        .apple-logo {
            width: 80px;
            height: 80px;
            fill: #ffffff;
            margin-bottom: 30px;
            animation: pulse 1.5s infinite alternate;
        }
        .loading-bar {
            width: 150px;
            height: 4px;
            background-color: #333333;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
        }
        .loading-progress {
            width: 0%;
            height: 100%;
            background-color: #ffffff;
            animation: load 4s linear forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        @keyframes pulse {
            0% { opacity: 0.4; }
            100% { opacity: 1.0; }
        }
    </style>
</head>
<body>

    <!-- リンゴマーク（iPhone風クラッシュ画面。Android風に変えてもOK！） -->
    <svg class="apple-logo" viewBox="0 0 170 170">
        <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.43-6.08-3.06-2.55-6.94-7.2-11.63-13.95-6.52-9.35-11.66-19.78-15.42-31.3-3.76-11.53-5.64-22.6-5.64-33.22 0-14.11 3.61-25.5 10.83-34.18 7.22-8.68 16.48-13.06 27.78-13.14 4.9 0 10.15 1.27 15.76 3.82 5.61 2.55 9.24 3.82 10.89 3.82 1.41 0 5.14-1.35 11.19-4.05 6.05-2.7 11.23-3.92 15.54-3.65 14.15.76 25.1 6.08 32.85 15.96-12.23 7.41-18.25 17.51-18.06 30.3.22 10.15 4.09 18.57 11.61 25.26 3.96 3.59 8.78 6.03 14.46 7.33-2.03 6.13-4.66 12.39-7.89 16.78zM119.55 31.67c0-7.89 2.84-15.22 8.52-21.99 5.68-6.77 12.87-10.42 21.57-10.96.11.76.16 1.47.16 2.13 0 7.39-3.05 15.01-9.15 22.86-6.1 7.85-13.43 11.77-21.99 11.76-.11-.54-.11-1.14-.11-1.8z"/>
    </svg>

    <div style="font-size: 14px; color: #888888; letter-spacing: 1px;">SYSTEM REBOOTING...</div>
    
    <div class="loading-bar">
        <div class="loading-progress"></div>
    </div>

    <script>
        // 1. スマホを「ブブッ」と振動させる（対応してるAndroidや一部ブラウザ向け）
        if ("vibrate" in navigator) {
            navigator.vibrate([300, 100, 300, 100, 500]);
        }

        // 2. 画面タップや戻るボタンを無効化しつつ、強制フルスクリーン化を試みる
        document.documentElement.requestFullscreen?.().catch(() => {});

        // 3. 4.5秒後に強制リロード（元の画面に戻る＝起動完了）
        setTimeout(() => {
            window.location.href = window.location.href; // 自分自身をリロード
        }, 4500);
    </script>
</body>
</html>
